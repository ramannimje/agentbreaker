apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentbreaker-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentbreaker-api
  template:
    metadata:
      labels:
        app: agentbreaker-api
    spec:
      containers:
        - name: api
          image: ghcr.io/<owner>/agentbreaker:latest
          ports:
            - containerPort: 8000
          env:
            - name: AGENTBREAKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentbreaker-secrets
                  key: AGENTBREAKER_DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
