version: '3.9'

services:
  # PostgreSQL budget store
  postgres:
    image: postgres:16-alpine
    container_name: agentbreaker-postgres
    environment:
      POSTGRES_DB: agentbreaker
      POSTGRES_USER: agentbreaker
      POSTGRES_PASSWORD: agentbreaker_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbreaker -d agentbreaker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentbreaker-net

  # FastAPI control plane
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: agentbreaker-api
    environment:
      DATABASE_URL: postgresql+asyncpg://agentbreaker:agentbreaker_dev_password@postgres:5432/agentbreaker
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agentbreaker-net

  # React ops dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: agentbreaker-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agentbreaker-net

volumes:
  postgres_data:

networks:
  agentbreaker-net:
    driver: bridge
